# Local full-stack orchestration. The API runs in demo mode without keys.
services:
  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_CHECK_ENABLED: 'false'
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -w @vayusense/web -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - .:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
